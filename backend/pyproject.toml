[project]
name = "text2sql2bi-backend"
version = "0.1.0"
description = "Text-to-SQL to BI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    # 在 pyproject.toml 或 requirements.txt 中
    "pydantic>=2.13.0,<3.0.0",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "openai>=1.50,<3",
    "qdrant-client>=1.12,<2",
    "langgraph>=0.2.50,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "redis>=5,<7",
    "sqlglot>=26,<30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
